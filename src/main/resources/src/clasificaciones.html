<html>

<head>
    <title id="titleTableau"></title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store" />
    <link id="favicon" rel="icon" type="image/png" href="favicon.ico"/>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="css/select2.min.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet">
    <script src="js/vendor/jquery.min.js"></script>
    <script src="js/vendor/select2.min.js"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/vendor/tableauwdc-2.4.latest.js" type="text/javascript"></script>
    <script src="js/vendor/lodash.js" type="text/javascript"></script>
    <script src="js/app/metadata-service.js" type="text/javascript"></script>
    <script src="js/app/translate.js" type="text/javascript"></script>
    <script src="js/app/tableauCodelists.js" type="text/javascript"></script>
    <script src="js/app/main.js" type="text/javascript"></script>
    <script>
        $(function () {
            getHeaderUrl().done(function(url) {
                $("#headerTemplate").load(url, function() {
                    loadTranslations();
                    translationsLoaded.done(() => $("#title-bar").find("span").text(appTitle));
                });
            });
            getFooterUrl().done(function(url) {
                $("#footerTemplate").load(url);
            });
            getFaviconUrl().done(function(url) {
                $("#favicon").attr("href", url);
            });
        });
    </script>
</head>

<body>
    <div id="headerTemplate"></div>
    <div class="content">
        <div class="section" id="selectData">
            <form>
                <div id="formContainer">
                    <h4 id="titleForm"></h4>
                    <label id="labelCodelistUrl" class="radioLabel">
                        <input id="codelistUrlInput" type="radio" name="datatype" onclick="chooseDataOption(this)" value="url">
                    </label>
                    <div class="row radioDiv" id="url" style="display: none">
                        <label id="labelUrl" class="col-xs-2"></label>
                        <input class="col-xs-10" name="url" id="inputUrl" />
                    </div>

                    <label id="selectVariableLabel" class="radioLabel">
                        <input id="selectVariableInput" type="radio" name="datatype" onchange="chooseDataOption(this)"
                            value="variableFamily" checked>
                    </label>
                    <div id="loaderVariableFamily" class="loader first-loader" style="display: none"></div>
                    <div class="selectDiv row radioDiv" id="variableFamily">
                        <label id="families" class="col-xs-2"></label>
                        <select class="col-xs-10" id="selectVariableFamily" style="width: 83.3%" onchange="searchVariables()"></select>
                    </div>
                    <div id="loaderVariable" class="loader" style="display: none"></div>
                    <div class="selectDiv row radioDiv" style="display: none">
                        <label id="variables" class="col-xs-2"></label>
                        <select class="col-xs-10" id="selectVariable" onchange="searchCodelists()"></select>
                    </div>
                    <div id="loaderCodelist" class="loader" style="display: none"></div>
                    <div class="selectDiv row radioDiv" style="display: none">
                        <label id="codelists" class="col-xs-2"></label>
                        <select class="col-xs-10" id="selectCodelist" onchange="updateDecodelists()"></select>
                    </div>
                </div>
                <div class="responseFormat">
                    <h4 id="responseFormat"></h4>
                    <div class="subtitle" id="decoding">
                        <label id="labelDecode" class="radioLabel">
                            <input type="checkbox" id="decode" onchange="onDownloadDecodeSelected(this)">
                        </label>
                        <div id="loaderDecode" class="loader" style="display: none"></div>
                        <div id="decodeWrapper" class="selectDiv row radioDiv" style="display: none">
                            <label id="decodeCodelists" class="col-xs-2"></label>
                            <select class="col-xs-10" id="selectDecodeCodelist"></select>
                        </div>
                    </div>
                    <div class="subtitle" id="labeling">
                        <label id="labelAllLanguages" class="radioLabel">
                            <input type="checkbox" id="allLanguages">
                        </label>
                    </div>
                </div>
                <div class="row" id="divButton">
                    <button type="button" class="btn btn-success col-xs-2 col-xs-offset-10" id="dataButton"></button>
                </div>
                <div id="errorMsg"></div>
            </form>
        </div>
        <div class="section">
            <div class="text">
                <p id="descCodelist">
                    <a id="linkCodelistAPI"></a>
                </p>
                <p id="codelistUse"></p>
                <ol>
                    <li id="liUrlCodelist"></li>
                    <li id="liCriteriaCodelist"></li>
            </div>
        </div>
    </div>
    <div id="footerTemplate"></div>
</body>

</html>
