<html>

<head>
    <title id="titleTableau"></title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store" />
    <link id="favicon" rel="icon" type="image/png" href="favicon.ico" />
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="css/select2.min.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet">
    <script src="js/vendor/jquery.min.js"></script>
    <script src="js/vendor/select2.min.js"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/vendor/tableauwdc-2.4.latest.js" type="text/javascript"></script>
    <script src="js/vendor/lodash.js" type="text/javascript"></script>
    <script src="js/app/metadata-service.js" type="text/javascript"></script>
    <script src="js/app/translate.js" type="text/javascript"></script>
    <script src="js/app/recodeDatesBase.js" type="text/javascript"></script>
    <script src="js/app/recodeDatesSdmx.js" type="text/javascript"></script>
    <script src="js/app/recodeDatesPx.js" type="text/javascript"></script>
    <script src="js/app/tableauIndicators.js" type="text/javascript"></script>
    <script src="js/app/main.js" type="text/javascript"></script>
    <script>
        $(function () {
            getHeaderUrl().done(function(url) {
                loadHtmlFromUrlIn("headerTemplate", url, function() {
                    initializeTranslations();
                    translationsLoaded.done(() => $("#title-bar").find("span").text(appTitle));
                });
            });
            getFooterUrl().done(function (url) {
                $("#footerTemplate").load(url);
            });
            getFaviconUrl().done(function (url) {
                $("#favicon").attr("href", url);
            });
        });
    </script>
</head>

<body>
    <div id="headerTemplate"></div>
    <div class="content">
        <div class="section" id="selectData">
            <form>
                <h4 id="titleForm"></h4>
                <label class="radioLabel">
                    <input type="radio" name="datatype" onclick="chooseDataOption(this)" value="url">
                    <span id="labelIndicatorUrl"></span>
                </label>
                <div class="row radioDiv" id="url" style="display: none">
                    <label id="labelUrl" class="col-xs-2"></label>
                    <input class="col-xs-10" name="url" id="inputUrl" />
                </div>

                <label class="radioLabel">
                    <input type="radio" name="datatype" onclick="chooseDataOption(this)" value="indicator" checked>
                    <span id="labelSelectIndicator"></span>
                </label>
                <div id="loaderSubject" class="loader first-loader" style="display: none"></div>
                <div class="selectDiv row radioDiv" id="indicator">
                    <label id="subjects" class="col-xs-2"></label>
                    <select class="col-xs-10" id="selectSubject" style="width: 83.3%"
                        onchange="searchIndicators()"></select>
                </div>
                <div id="loaderIndicator" class="loader" style="display: none"></div>
                <div class="selectDiv row radioDiv" style="display: none">
                    <label id="indicators" class="col-xs-2"></label>
                    <select class="col-xs-10" id="selectIndicator"></select>
                </div>

                <label class="radioLabel">
                    <input type="radio" name="datatype" onclick="chooseDataOption(this)" value="indicatorInstance">
                    <span  id="labelIndicatorInstance" ></span>
                </label>
                <div id="loaderIndicatorSystem" class="loader first-loader" style="display: none"></div>
                <div class="selectDiv row radioDiv" id="indicatorInstance" style="display: none">
                    <label id="indicatorSystems" class="col-xs-2"></label>
                    <select class="col-xs-10" id="selectIndicatorSystem" style="width: 83.3%"
                        onchange="searchIndicatorsInstances()"></select>
                </div>
                <div id="loaderIndicatorInstance" class="loader" style="display: none"></div>
                <div class="selectDiv row radioDiv" style="display: none">
                    <label id="indicatorInstances" class="col-xs-2"></label>
                    <select class="col-xs-10" id="selectIndicatorInstance"></select>
                </div>

                <div class="responseFormat">
                    <h4 id="responseFormat"></h4>
                    <div class="subtitle">
                        <span id="dataModel"></span>
                        <label class="radioLabel">
                            <input type="checkbox" id="measureColumns" checked>
                            <span id="labelMeasureColumns"></span>
                        </label>
                        <label class="radioLabel">
                            <input type="checkbox" id="starModel" checked>
                            <span id="labelStarModel"></span>
                        </label>
                    </div>
                    <div class="subtitle">
                        <span id="labeling"></span>
                        <label class="radioLabel">
                            <input type="checkbox" id="recodeDates" checked>
                            <span id="labelRecodeDates"></span>
                        </label>
                        <label class="radioLabel">
                            <input type="checkbox" id="showGranularity" checked>
                            <span id="labelShowGranularity"></span>
                        </label>
                        <label class="radioLabel">
                            <input type="checkbox" id="showLabels" onclick="enableAllLanguages()">
                            <span id="labelShowLabels"></span>
                        </label>
                        <label class="radioLabel">
                            <input type="checkbox" id="allLanguages" disabled>
                            <span id="labelAllLanguages"></span>
                        </label>
                    </div>



                </div>
                <div class="row" id="divButton">
                    <button type="button" class="btn btn-success col-xs-2 col-xs-offset-10" id="dataButton"></button>
                </div>
                <div id="errorMsg"></div>
            </form>
        </div>
        <div class="section">
            <div class="text">
                <p>
                    <span id="descIndicatorPre"></span><a id="linkIndicatorAPI"></a><span id="descIndicatorPost"></span>
                </p>
                <p id="indicatorUse"></p>
                <ol>
                    <li id="liUrlIndicator"></li>
                    <li id="liCriteriaIndicator"></li>
                </ol>
            </div>
        </div>
    </div>
    <div id="footerTemplate"></div>
</body>

</html>
